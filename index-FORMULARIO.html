<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO</title>
</head>
<body>
     <h1>REGISTRO DE USUARIOS</h1>
         <form>
                <section>
                    <div>
                        <label for="fullname">NOMBRE COMPLETO</label>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Howard P. Lovecraft"
                            maxlength="15"
                            minlength="10"
                            required>
                    </div>
                    <div>
                        <label for="email">CORREO ELECTRONICO</label>
                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="HowardLovecraft@gmail.com"
                            required>
                    </div>
                        <label for="password">CONTRASEÑA</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required>     
                    </div>
                </section>

                <section>
                    <div>
                        <h2>SELECCIONE SU LENGUAJE (unica opción)</h2>
                    </div>
                    <div>
                        <label for="html">HTML</label>
                        <input
                            type="radio"
                            name="lenguaje-favorito"
                            id="html">
                    </div>
                    <div>
                        <label for="css">CSS</label>
                        <input
                            type="radio"
                            name="lenguaje-favorito"
                            id="css">
                    </div>
                    <div>
                        <label for="javascript">JAVASCRIPT</label>
                        <input
                            type="radio"
                            name="lenguaje-favorito"
                            id="javascript">
                    </div>
                </section>

                <section>
                    <div>
                        <h2>SELECCIONE TODOS LOS LENGUAJES QUE CONOCE (opción multiple)</h2>
                    </div>
                    <div>
                        <label for="css">CSS</label>
                        <input 
                            type="checkbox"
                            name="lenguajes-conocidos"
                            id="css">
                    </div>
                    <div>
                        <label for="html">HTML</label>
                        <input
                            type="checkbox"
                            name="lenguajes-conocidos"
                            id="html">
                    </div>
                    <div>
                        <label for="javascript">JAVASCRIPT</label>
                        <input
                            type="checkbox"
                            name="lenguajes-conocidos"
                            id="javascript">
                    </div>
                    <div>
                        <label for="phyton">PHYTON</label>
                        <input
                            type="checkbox"
                            name="lenguajes-conocidos"
                            id="phyton">
                    </div>     
                </section>

                <section>
                    <div>
                        <label for="pais">ELEGÍ TU PAÍS DE ORIGEN:</label>
                        <select id="pais" name="pais">
                            <option value="AR">ARGENTINA</option>
                            <option value="BR">BRASIL</option>
                            <option value="CH">CHILE</option>
                            <option value="VZ">VENEZUELA</option>
                            <option value="UR">URUGUAY</option>   
                            <option value="NO" selected disabled>No Seleccionado</option>            
                        </select>
                    </div>
                </section>

                <section>
                    <div>
                        <label for="comentarios">DEJANOS UN COMENTARIO</label>
                        <textarea
                            name="comentario"
                            id="comentario"
                            placeholder="Escribí acá tu comentario"
                            rows="10"
                            cols="30"
                            maxlength="300">
                        </textarea>
                    </div>
                </section>

                <section>
                    <div>
                        <label for="documentacion">SUBIR DOCUMENTACION</label>
                        <input
                            type="file"
                            name="documentacion"
                            id="documentacion">
                    </div>
                </section>

                <section>
                    <div>
                        <button type="submit">ENVIAR</button>
                    </div>
                </section>
</form>
</body>
</html>
